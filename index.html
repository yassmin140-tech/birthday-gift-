<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاجأة عيد ميلاد سعيدة! 🎁</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #060411 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }
        /* واجهة الهدية المغلقة */
        #gift-screen {
            text-align: center;
            z-index: 100;
            transition: all 0.8s ease;
        }
        .gift-box {
            font-size: 100px;
            cursor: pointer;
            display: inline-block;
            animation: wobble 1.5s infinite ease-in-out;
            filter: drop-shadow(0 0 20px rgba(255, 105, 180, 0.6));
        }
        @keyframes wobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-8deg) scale(1.1); }
            75% { transform: rotate(8deg) scale(1.1); }
        }
        .gift-hint {
            font-size: 20px;
            margin-top: 20px;
            color: #ff69b4;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
            font-weight: bold;
        }
        /* واجهة المفاجأة الرئيسية */
        #main-content {
            display: none;
            text-align: center;
            opacity: 0;
            transition: opacity 1s ease;
            z-index: 10;
        }
        .cake {
            font-size: 80px;
            margin-bottom: 20px;
            animation: popUp 1s ease-out;
        }
        h1 {
            font-size: 40px;
            background: linear-gradient(45deg, #ff1493, #ff69b4, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 20, 147, 0.2);
            margin-bottom: 15px;
        }
        p {
            font-size: 22px;
            color: #e0e0ff;
            line-height: 1.6;
            max-width: 500px;
            padding: 0 20px;
        }
        /* الألعاب النارية والقذائف */
        .firework {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            animation: explode 1s ease-out forwards;
        }
        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }
        audio {
            display: none;
        }
    </style>
</head>
<body>

    <!-- موسيقى الخلفية التفاعلية -->
    <audio id="birthday-music" loop>
        <source src="https://soundhelix.com" type="audio/mpeg">
    </audio>

    <!-- شاشة الهدية الأولى -->
    <div id="gift-screen">
        <div class="gift-box" onclick="revealSurprise()">🎁</div>
        <div class="gift-hint">اضغط على الهدية لفتح المفاجأة بالصوت! ✨</div>
    </div>

    <!-- شاشة المفاجأة المركزية بعد الضغط -->
    <div id="main-content">
        <div class="cake">🎂✨🎈</div>
        <h1>عيد ميلاد سعيد! 🎉</h1>
        <p>أتمنى لك عاماً مليئاً بالأفراح والمسرات وتحقيق كل الأمنيات الرائعة! أنت شخص مميز وتستحق الأفضل دائماً ❤️</p>
    </div>

    <script>
        function revealSurprise() {
            // تشغيل الموسيقى
            const music = document.getElementById('birthday-music');
            music.play().catch(e => console.log("تحتاج المنصة إذن تشغيل الصوت"));

            // تبديل الشاشات بحركة سلسة
            document.getElementById('gift-screen').style.display = 'none';
            const content = document.getElementById('main-content');
            content.style.display = 'block';
            setTimeout(() => content.style.opacity = '1', 50);

            // إطلاق الألعاب النارية اللانهائية
            setInterval(launchFirework, 400);
        }

        function launchFirework() {
            const colors = ['#ff1493', '#00ffff', '#ff00ff', '#ffff00', '#00ff00', '#ff4500'];
            const startX = Math.random() * window.innerWidth;
            const startY = Math.random() * window.innerHeight;
            
            // توليد شظايا الانفجار لكل لعبة نارية
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.classList.add('firework');
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = startX + 'px';
                particle.style.top = startY + 'px';
                
                // تحديد اتجاه عشوائي متفجر لكل شظية
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 150 + 50;
                particle.style.setProperty('--x', Math.cos(angle) * distance + 'px');
                particle.style.setProperty('--y', Math.sin(angle) * distance + 'px');
                
                document.body.appendChild(particle);
                
                // تنظيف المتصفح من الشظايا بعد انتهاء التأثير
                setTimeout(() => particle.remove(), 1000);
            }
        }
    </script>
</body>
</html>
